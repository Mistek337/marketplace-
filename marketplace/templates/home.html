{% extends 'base.html' %}
{% block content %}
<h1 class="mt-3">Marketplace Demo UI</h1>
<p class="text-muted">Минимальная витрина для проверки B2C catalog API (OpenAPI).</p>
<p><a class="btn btn-outline-primary" href="{% url 'catalog' %}">Открыть каталог с карточками</a></p>

<div class="row g-3 mb-3">
    <div class="col-md-4">
        <label class="form-label" for="searchInput">Поиск</label>
        <input id="searchInput" class="form-control" placeholder="Например: iPhone">
    </div>
    <div class="col-md-3">
        <label class="form-label" for="limitInput">Лимит</label>
        <input id="limitInput" type="number" class="form-control" value="10" min="1" max="100">
    </div>
    <div class="col-md-3">
        <label class="form-label" for="offsetInput">Offset</label>
        <input id="offsetInput" type="number" class="form-control" value="0" min="0">
    </div>
    <div class="col-md-2 d-flex align-items-end">
        <button id="loadProductsBtn" class="btn btn-primary w-100">Загрузить</button>
    </div>
</div>

<div class="card mb-3">
    <div class="card-body">
        <h5 class="card-title">Список товаров</h5>
        <div id="listStatus" class="text-muted mb-2">Нажми «Загрузить».</div>
        <div id="productsContainer" class="list-group"></div>
    </div>
</div>

<p class="text-muted small">По клику открывается страница товара <code>/products/&lt;id&gt;</code>.</p>

<script>
(() => {
    const loadBtn = document.getElementById("loadProductsBtn");
    const productsContainer = document.getElementById("productsContainer");
    const listStatus = document.getElementById("listStatus");
    const searchInput = document.getElementById("searchInput");
    const limitInput = document.getElementById("limitInput");
    const offsetInput = document.getElementById("offsetInput");

    function formatRub(kopecks) {
        const rub = Number(kopecks || 0) / 100;
        return rub.toLocaleString("ru-RU", { maximumFractionDigits: 0 }) + " ₽";
    }

    async function loadProducts() {
        listStatus.textContent = "Загрузка...";
        productsContainer.innerHTML = "";

        const params = new URLSearchParams();
        const q = searchInput.value.trim();
        params.set("limit", limitInput.value.trim() || "10");
        params.set("offset", offsetInput.value.trim() || "0");
        if (q) params.set("q", q);

        try {
            const response = await fetch("/api/v1/catalog/products?" + params.toString());
            if (!response.ok) {
                listStatus.textContent = "Ошибка загрузки списка: " + response.status;
                return;
            }
            const data = await response.json();
            const items = Array.isArray(data.items) ? data.items : [];
            listStatus.textContent = "Получено: " + items.length + " / total: " + (data.total_count ?? "-");

            if (!items.length) {
                productsContainer.innerHTML = '<div class="text-muted">Пусто</div>';
                return;
            }

            items.forEach((item) => {
                const row = document.createElement("a");
                row.href = "/products/" + item.id;
                row.className = "list-group-item list-group-item-action";
                const stock = item.has_stock ? "В наличии" : "Нет в наличии";
                row.innerHTML =
                    '<motion class="d-flex w-100 justify-content-between">' +
                    "<strong>" + (item.name || "(без названия)") + "</strong>" +
                    "<small>" + formatRub(item.min_price) + "</small>" +
                    "</div>" +
                    '<small class="text-muted">' + stock + " · id: " + item.id + "</small>";
                productsContainer.appendChild(row);
            });
        } catch (error) {
            listStatus.textContent = "Ошибка сети: " + error.message;
        }
    }

    loadBtn.addEventListener("click", loadProducts);
})();
</script>
{% endblock %}
