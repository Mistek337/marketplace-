services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: b2b
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d b2b"]
      interval: 5s
      timeout: 5s
      retries: 10

  b2b:
    build:
      context: ./b2b
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      POSTGRES_DB: b2b
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      B2C_TO_B2B_KEY: dev-b2c-key
      MODERATION_BASE_URL: http://moderation:8002
      B2B_TO_MODERATION_KEY: dev-b2b-moderation-key
      MODERATION_TO_B2B_KEY: dev-moderation-b2b-key
      # Показывать в каталоге B2C товары до MODERATED (локально; на проде отключить).
      CATALOG_DEV_VISIBILITY: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,b2b
    depends_on:
      db:
        condition: service_healthy
      moderation:
        condition: service_started

  moderation:
    build:
      context: ./moderation
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      POSTGRES_DB: moderation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      B2B_TO_MODERATION_KEY: dev-b2b-moderation-key
      MODERATION_TO_B2B_KEY: dev-moderation-b2b-key
      B2B_BASE_URL: http://b2b:8001
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,moderation
    depends_on:
      db:
        condition: service_healthy

  b2c:
    build:
      context: ./marketplace
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: neomarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      B2B_BASE_URL: http://b2b:8001
      B2B_SERVICE_KEY: dev-b2c-key
      B2B_API_PREFIX: /api/v1
      CATALOG_DEV_VISIBILITY: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,b2c
    depends_on:
      db:
        condition: service_healthy
      b2b:
        condition: service_started

volumes:
  pgdata:
